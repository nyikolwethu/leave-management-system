AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: "Serverless Leave Management System \u2014 Lambda, API Gateway, DynamoDB,\
  \ Cognito, and SES. Designed to run within the AWS Free Tier.\n"
Parameters:
  SenderEmail:
    Type: String
    Description: SES-verified sender address for notification emails
    Default: leave-system@yourcompany.com
  StageName:
    Type: String
    Default: prod
Globals:
  Function:
    Runtime: python3.12
    Timeout: 10
    MemorySize: 128
    Environment:
      Variables:
        LEAVE_REQUESTS_TABLE:
          Ref: LeaveRequestsTable
        EMPLOYEES_TABLE:
          Ref: EmployeesTable
        SENDER_EMAIL:
          Ref: SenderEmail
Resources:
  EmployeesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: leave-mgmt-Employees
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
      - AttributeName: employeeId
        AttributeType: S
      KeySchema:
      - AttributeName: employeeId
        KeyType: HASH
  LeaveRequestsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: leave-mgmt-LeaveRequests
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
      - AttributeName: requestId
        AttributeType: S
      - AttributeName: employeeId
        AttributeType: S
      KeySchema:
      - AttributeName: requestId
        KeyType: HASH
      - AttributeName: employeeId
        KeyType: RANGE
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: leave-mgmt-user-pool
      AutoVerifiedAttributes:
      - email
      UsernameAttributes:
      - email
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: true
  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: leave-mgmt-web
      UserPoolId:
        Ref: UserPool
      GenerateSecret: false
      ExplicitAuthFlows:
      - ALLOW_USER_SRP_AUTH
      - ALLOW_USER_PASSWORD_AUTH
      - ALLOW_REFRESH_TOKEN_AUTH
  EmployeesGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: Employees
      UserPoolId:
        Ref: UserPool
      Description: Standard employee permissions
  ManagersGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: Managers
      UserPoolId:
        Ref: UserPool
      Description: Manager permissions (approve/reject, view team requests)
  LeaveApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName:
        Ref: StageName
      Cors:
        AllowMethods: '''GET,POST,PUT,OPTIONS'''
        AllowHeaders: '''Content-Type,Authorization'''
        AllowOrigin: '''*'''
      GatewayResponses:
        DEFAULT_4XX:
          ResponseParameters:
            Headers:
              Access-Control-Allow-Origin: '''*'''
              Access-Control-Allow-Headers: '''Content-Type,Authorization'''
        DEFAULT_5XX:
          ResponseParameters:
            Headers:
              Access-Control-Allow-Origin: '''*'''
              Access-Control-Allow-Headers: '''Content-Type,Authorization'''
      Auth:
        DefaultAuthorizer: CognitoAuthorizer
        AddDefaultAuthorizerToCorsPreflight: false
        Authorizers: null
  SubmitLeaveFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: leave-mgmt-submitLeave
      CodeUri: SubmitLeaveFunction
      Handler: app.lambda_handler
      Policies:
      - DynamoDBCrudPolicy:
          TableName:
            Ref: LeaveRequestsTable
      - DynamoDBReadPolicy:
          TableName:
            Ref: EmployeesTable
      - SESCrudPolicy:
          IdentityName:
            Ref: SenderEmail
      Events:
        SubmitLeave:
          Type: Api
          Properties:
            RestApiId:
              Ref: LeaveApi
            Path: /leave
            Method: POST
    Metadata:
      SamResourceId: SubmitLeaveFunction
  ApproveRejectLeaveFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: leave-mgmt-approveRejectLeave
      CodeUri: ApproveRejectLeaveFunction
      Handler: app.lambda_handler
      Policies:
      - DynamoDBCrudPolicy:
          TableName:
            Ref: LeaveRequestsTable
      - DynamoDBCrudPolicy:
          TableName:
            Ref: EmployeesTable
      - SESCrudPolicy:
          IdentityName:
            Ref: SenderEmail
      Events:
        ApproveRejectLeave:
          Type: Api
          Properties:
            RestApiId:
              Ref: LeaveApi
            Path: /leave/{requestId}
            Method: PUT
    Metadata:
      SamResourceId: ApproveRejectLeaveFunction
  GetLeaveBalanceFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: leave-mgmt-getLeaveBalance
      CodeUri: GetLeaveBalanceFunction
      Handler: app.lambda_handler
      Policies:
      - DynamoDBReadPolicy:
          TableName:
            Ref: EmployeesTable
      Events:
        GetLeaveBalance:
          Type: Api
          Properties:
            RestApiId:
              Ref: LeaveApi
            Path: /employee/{id}/balance
            Method: GET
    Metadata:
      SamResourceId: GetLeaveBalanceFunction
  GetLeaveHistoryFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: leave-mgmt-getLeaveHistory
      CodeUri: GetLeaveHistoryFunction
      Handler: app.lambda_handler
      Policies:
      - DynamoDBReadPolicy:
          TableName:
            Ref: LeaveRequestsTable
      Events:
        GetLeaveHistory:
          Type: Api
          Properties:
            RestApiId:
              Ref: LeaveApi
            Path: /employee/{id}/history
            Method: GET
    Metadata:
      SamResourceId: GetLeaveHistoryFunction
  GetPendingRequestsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: leave-mgmt-getPendingRequests
      CodeUri: GetPendingRequestsFunction
      Handler: app.lambda_handler
      Policies:
      - DynamoDBReadPolicy:
          TableName:
            Ref: LeaveRequestsTable
      - DynamoDBReadPolicy:
          TableName:
            Ref: EmployeesTable
      Events:
        GetPendingRequests:
          Type: Api
          Properties:
            RestApiId:
              Ref: LeaveApi
            Path: /manager/{id}/pending
            Method: GET
    Metadata:
      SamResourceId: GetPendingRequestsFunction
  LowBalanceCheckFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: leave-mgmt-lowBalanceCheck
      CodeUri: LowBalanceCheckFunction
      Handler: app.lambda_handler
      Policies:
      - DynamoDBReadPolicy:
          TableName:
            Ref: EmployeesTable
      - SESCrudPolicy:
          IdentityName:
            Ref: SenderEmail
      Events:
        WeeklySchedule:
          Type: Schedule
    Metadata:
      SamResourceId: LowBalanceCheckFunction
